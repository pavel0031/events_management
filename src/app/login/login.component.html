<div class="login-shell">
  <div class="login-panel">
    <h1>Event Management Login</h1>
    <form (ngSubmit)="login()" autocomplete="off">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit">Login</button>
      <p class="hint">
        Use <strong>admin@grade.com</strong> / <strong>admin123</strong>
      </p>
      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
